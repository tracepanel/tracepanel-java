name: CI

# The build and every test: on Spring Boot 4 and 3.5, and Ktor, with a MongoDB, a Redis, a Kafka and a RabbitMQ to
# record calls to. Then the libraries as they would go to Maven Central, unsigned, into the local repository. A change
# to the README, the changelog or the images alone builds nothing: `changes` says so, and the build is skipped, which
# the branch's required check counts as passed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          # A pull request: what it changes from its base. A push to main: what the push added.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch, or a base this checkout doesn't have: build.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          # Anything but the pages, the license and the README's images is code.
          if echo "$files" | grep -qvE '(\.md$|^LICENSE$|^docs/)'; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  check:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:9
        ports: ["27017:27017"]
      redis:
        image: redis:8
        ports: ["6379:6379"]
      kafka:
        image: apache/kafka:4.3.1
        ports: ["9092:9092"]
      rabbitmq:
        image: rabbitmq:4
        ports: ["5672:5672"]
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/test
      TEST_REDIS_PORT: "6379"
      TEST_KAFKA_BOOTSTRAP: localhost:9092
      TEST_RABBITMQ_PORT: "5672"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The toolchain the build asks for: it compiles for Java 17 and runs the tests.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check --console=plain
      - run: ./gradlew publishToMavenLocal --console=plain
